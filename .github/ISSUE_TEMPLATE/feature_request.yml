name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API details
      description: If you have seen the app do this, paste what you know about the request and response (redact personal data). `scripts/probe_api.py --raw` output helps for new device types.
